[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-quality-analytics-platform"
version = "1.0.0"
description = "Python-based Six Sigma traffic quality analytics platform."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
